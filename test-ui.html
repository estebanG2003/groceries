<!doctype html><meta charset="utf-8"><title>ui-test-running</title>
<style>body{font:14px system-ui;margin:0}#f{width:390px;height:760px;border:0;display:block}</style>
<iframe id="f"></iframe>
<pre id="log"></pre>
<script>
/* Integration test: drives the REAL app UI (index.html) through real DOM
   events at a 390px viewport, running the goal's verification sequence.
   Result is written to <body data-result="..."> and the title for --dump-dom. */
const results = [];
const ok = (cond, msg) => { results.push((cond ? 'PASS' : 'FAIL') + ' : ' + msg); return cond; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const f = document.getElementById('f');

function loadFrame(url) {
  return new Promise(res => { f.onload = () => res(); f.src = url; });
}
const doc = () => f.contentWindow.document;
const $ = sel => doc().querySelector(sel);
const $$ = sel => [...doc().querySelectorAll(sel)];

// type into the name box (dispatch input so the Add button enables), set qty & category, submit
async function addItem(name, qty, catId) {
  const nameIn = $('#nameIn');
  nameIn.value = name;
  nameIn.dispatchEvent(new f.contentWindow.Event('input', { bubbles: true }));
  // qty starts at 1; press + (qty-1) times
  const plus = doc().getElementById('qPlus');
  for (let i = 1; i < qty; i++) plus.click();
  doc().getElementById('catIn').value = catId;
  doc().getElementById('addform').dispatchEvent(new f.contentWindow.Event('submit', { bubbles: true, cancelable: true }));
  await sleep(30);
}

// names in DOM order within the list
const itemNames = () => $$('.item .name').map(n => n.textContent.replace(/\s*×\d+$/, '').trim());
const itemByName = name => $$('.item').find(li => li.querySelector('.name').textContent.includes(name));

async function run() {
  try {
    const origin = location.origin;
    // clean slate (same-origin localStorage shared with the iframe)
    localStorage.removeItem('grocery-app-v1');
    await loadFrame(origin + '/index.html');
    await sleep(50);

    // --- add two items with quantities and categories (same category to test sink) ---
    await addItem('Bananas', 3, 'produce');
    await addItem('Apples', 2, 'produce');
    ok($$('.item').length === 2, 'two items added and rendered');
    const b = itemByName('Bananas');
    ok(b && b.querySelector('.qty') && b.querySelector('.qty').textContent === '×3', 'Bananas shows quantity ×3');
    ok(itemNames().join(',') === 'Bananas,Apples', 'initial order is insertion order (Bananas, Apples)');

    // --- check one off and confirm it sinks to the bottom ---
    itemByName('Bananas').querySelector('.box').click();
    await sleep(30);
    ok(itemByName('Bananas').classList.contains('checked'), 'Bananas is marked checked');
    ok(itemNames().join(',') === 'Apples,Bananas', 'checked Bananas sinks below unchecked Apples');

    // --- delete an item and undo it ---
    itemByName('Apples').querySelector('.del').click();
    await sleep(30);
    ok(!itemByName('Apples'), 'Apples removed after delete');
    ok($('#toast').classList.contains('show'), 'undo toast is shown after delete');
    doc().getElementById('toastUndo').click();
    await sleep(30);
    ok(!!itemByName('Apples'), 'Apples restored after undo (delete)');

    // --- reset all and confirm undo restores the prior check-state ---
    // Bananas is currently checked; Apples unchecked.
    ok(itemByName('Bananas').classList.contains('checked'), 'pre-reset: Bananas still checked');
    doc().getElementById('reset').click();     // uncheck all
    await sleep(30);
    ok($$('.item.checked').length === 0, 'reset unchecks all items');
    doc().getElementById('toastUndo').click(); // undo reset
    await sleep(30);
    ok(itemByName('Bananas').classList.contains('checked'), 'undo restores prior checked state (Bananas checked again)');
    ok(!itemByName('Apples').classList.contains('checked'), 'undo keeps Apples unchecked as before');

    // --- refresh the page and confirm everything persisted ---
    await loadFrame(origin + '/index.html');
    await sleep(50);
    ok($$('.item').length === 2, 'both items persisted across reload');
    ok(itemByName('Bananas'), 'Bananas persisted');
    ok(itemByName('Bananas').classList.contains('checked'), 'checked state persisted across reload');
    ok(itemByName('Bananas').querySelector('.qty').textContent === '×3', 'quantity persisted across reload');

    // --- category filtering ---
    const chips = $$('.chip');
    ok(chips.length >= 2 && chips.some(c => /Produce/.test(c.textContent)), 'category filter chip present');

    // ============ NEW FEATURES ============
    // clean slate for feature tests
    localStorage.removeItem('grocery-app-v1');
    localStorage.removeItem('grocery-history-v1');
    await loadFrame(location.origin + '/index.html');
    await sleep(50);

    // --- (3) merge duplicates ---
    await addItem('Milk', 1, 'dairy');
    await addItem('Milk', 2, 'dairy');
    const milks = $$('.item').filter(li => li.querySelector('.name').textContent.includes('Milk'));
    ok(milks.length === 1, 'adding "Milk" twice makes ONE row (merge)');
    ok(itemByName('Milk').querySelector('.qty').textContent === '×3', 'merged Milk shows ×3');

    // --- (1) edit in place ---
    itemByName('Milk').querySelector('.edit-btn').click();
    await sleep(30);
    const editInput = $('.edit-name');
    ok(!!editInput && editInput.value === 'Milk', 'edit pencil opens inline editor prefilled');
    editInput.value = 'Oat milk';
    $('.edit-save').click();
    await sleep(30);
    ok(!!itemByName('Oat milk') && !itemByName('Milk'), 'edit renames the item in place');

    // --- (2) autocomplete from history ---
    // history now knows "Milk" (recorded on add) and "Oat milk"
    const nEl = $('#nameIn');
    nEl.dispatchEvent(new f.contentWindow.Event('focus', { bubbles: true }));
    nEl.value = 'oat';
    nEl.dispatchEvent(new f.contentWindow.Event('input', { bubbles: true }));
    await sleep(30);
    const suggs = $$('.sugg');
    ok(suggs.length >= 1 && suggs.some(s => /Oat milk/.test(s.textContent)), 'typing "oat" suggests past item "Oat milk"');
    // tapping a suggestion adds it immediately
    const before = $$('.item').length;
    suggs.find(s => /Oat milk/.test(s.textContent)).click();
    await sleep(30);
    // "Oat milk" already exists unchecked in dairy -> merge bumps qty, count stays same
    ok(itemByName('Oat milk').querySelector('.qty').textContent === '×4', 'tapping suggestion adds via merge (×3 -> ×4)');

    // --- (4) category order (reorder via settings) ---
    await addItem('Apple', 1, 'produce');   // now have dairy + produce groups
    doc().getElementById('settingsBtn').click();
    await sleep(30);
    const rowsBefore = $$('#catOrder .cat-row .c-label').map(x => x.textContent.trim());
    ok(rowsBefore[0].includes('Produce'), 'default order: Produce is first in settings list');
    // move Produce down one
    const firstDown = $$('#catOrder .cat-row')[0].querySelectorAll('.c-move')[1];
    firstDown.click();
    await sleep(30);
    const rowsAfter = $$('#catOrder .cat-row .c-label').map(x => x.textContent.trim());
    ok(!rowsAfter[0].includes('Produce'), 'after move-down, Produce is no longer first in settings');
    doc().getElementById('closeSettings').click();
    await sleep(30);
    // list group order should reflect the new category order (Dairy group before Produce group)
    const groupHeads = $$('.group-head').map(g => g.textContent);
    const idxDairy = groupHeads.findIndex(t => /Dairy/.test(t));
    const idxProduce = groupHeads.findIndex(t => /Produce/.test(t));
    ok(idxDairy > -1 && idxProduce > -1 && idxDairy < idxProduce, 'list groups follow custom order (Dairy before Produce)');

    // --- (5) custom RGB theme preset ---
    doc().getElementById('settingsBtn').click();
    await sleep(40);
    const swBefore = $$('#swatches .swatch').length;
    const setRange = (sel, v) => { const el = $(sel); el.value = v; el.dispatchEvent(new f.contentWindow.Event('input', { bubbles: true })); };
    setRange('#rIn', 255); setRange('#gIn', 0); setRange('#bIn', 150);   // -> #ff0096
    await sleep(20);
    $('#addPreset').click();
    await sleep(40);
    ok($$('#swatches .swatch').length === swBefore + 1, 'custom color adds a new preset swatch');
    const accentVar = () => f.contentWindow.document.documentElement.style.getPropertyValue('--accent').trim().toLowerCase();
    ok(accentVar() === '#ff0096', 'custom color applied to --accent (' + accentVar() + ')');
    ok(!$('#removeCustom').hidden, 'remove-custom button shows while a custom color is active');
    // persists across reload
    await loadFrame(location.origin + '/index.html');
    await sleep(50);
    ok(accentVar() === '#ff0096', 'custom theme persists across reload');
    // remove it -> reverts to green preset
    doc().getElementById('settingsBtn').click();
    await sleep(30);
    $('#removeCustom').click();
    await sleep(30);
    ok($$('#swatches .swatch').length === swBefore, 'removing custom color drops its swatch');
    ok(accentVar() === '#16a34a', 'after removing custom, accent reverts to green');

  } catch (e) {
    results.push('FAIL : threw ' + (e && e.message ? e.message : e));
  }

  const failed = results.filter(r => r.startsWith('FAIL')).length;
  document.getElementById('log').textContent = results.join('\n') + '\n\n' + (failed ? failed + ' FAILED' : 'ALL PASS');
  document.body.setAttribute('data-result', JSON.stringify({ failed, results }));
  document.title = failed ? ('UITEST:FAIL:' + failed) : 'UITEST:ALLPASS';
}
run();
</script>
