<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#16a34a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Groceries" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <title>Groceries</title>
  <style>
    :root {
      --bg: #f6f7f8;
      --surface: #ffffff;
      --surface-2: #f0f2f4;
      --text: #14181d;
      --text-dim: #66707a;
      --border: #e4e8ec;
      --accent: #16a34a;       /* owned by JS (theme picker); this is the no-JS fallback */
      --accent-dim: #dcfce7;
      --danger: #dc2626;
      --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
      --radius: 14px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    /* Dark neutrals — applied when the user forces dark, OR when the system is
       dark and the user hasn't forced light. Accent vars are set by JS, not here. */
    :root[data-theme="dark"] {
      --bg: #0f1216; --surface: #171b21; --surface-2: #1e242c; --text: #e8ecef;
      --text-dim: #8a949e; --border: #262d36; --danger: #f87171;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.25);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1216; --surface: #171b21; --surface-2: #1e242c; --text: #e8ecef;
        --text-dim: #8a949e; --border: #262d36; --danger: #f87171;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.25);
      }
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      min-height: 100vh; overscroll-behavior-y: none;
    }
    .app { max-width: 640px; margin: 0 auto; padding-bottom: calc(160px + var(--safe-bottom)); }

    header {
      position: sticky; top: 0; z-index: 20; background: var(--bg);
      padding: calc(14px + var(--safe-top)) 16px 8px; border-bottom: 1px solid var(--border);
    }
    .title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.02em; }
    .head-right { display: flex; align-items: center; gap: 10px; }
    .count { font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
    .icon-btn {
      border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
      width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; cursor: pointer;
    }
    .icon-btn:active { background: var(--surface-2); }
    .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }

    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; border: 1px solid var(--border); background: var(--surface);
      color: var(--text-dim); padding: 7px 13px; border-radius: 999px; font-size: 14px;
      font-weight: 500; cursor: pointer; white-space: nowrap; user-select: none; transition: all .12s ease;
    }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    main { padding: 8px 12px 0; }
    .group { margin-top: 16px; }
    .group-head {
      display: flex; align-items: center; gap: 7px; padding: 2px 6px 8px;
      font-size: 13px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em;
    }
    .group-head .g-count { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; }

    ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .item {
      display: flex; align-items: center; gap: 12px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 14px;
      box-shadow: var(--shadow); transition: opacity .15s ease;
    }
    .item.checked { opacity: .55; }
    .item.checked .name { text-decoration: line-through; text-decoration-color: var(--text-dim); }
    .box {
      flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--border);
      display: grid; place-items: center; cursor: pointer; transition: all .12s ease; background: var(--surface-2);
    }
    .box.on { background: var(--accent); border-color: var(--accent); }
    .box svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3.2; fill: none; opacity: 0; transition: opacity .1s; }
    .box.on svg { opacity: 1; }
    .item .body { flex: 1 1 auto; min-width: 0; cursor: pointer; }
    .name { font-size: 16px; font-weight: 500; word-break: break-word; }
    .qty { display: inline-block; margin-left: 7px; font-size: 13px; font-weight: 600; color: var(--accent); }
    .item.checked .qty { color: var(--text-dim); }
    .del {
      flex: 0 0 auto; border: none; background: none; color: var(--text-dim); padding: 6px;
      cursor: pointer; border-radius: 8px; display: grid; place-items: center;
    }
    .del:active { background: var(--surface-2); color: var(--danger); }
    .del svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; }

    /* "+ Add item" affordance at the end of the list */
    .list-add {
      display: flex; align-items: center; gap: 8px; width: 100%; margin: 18px 0 6px;
      border: 1.5px dashed var(--border); background: transparent; color: var(--text-dim);
      border-radius: var(--radius); padding: 14px; font-size: 15px; font-weight: 500; cursor: pointer;
    }
    .list-add:active { background: var(--surface-2); }
    .list-add span.plus { font-size: 20px; line-height: 1; }

    .empty { text-align: center; color: var(--text-dim); padding: 60px 20px; }
    .empty .big { font-size: 44px; margin-bottom: 10px; }

    /* Add bar — TWO rows: full-width name input on top so you can see what you type. */
    .addbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface);
      border-top: 1px solid var(--border); padding: 10px 12px calc(10px + var(--safe-bottom));
      box-shadow: 0 -2px 12px rgba(0,0,0,.06);
    }
    .addbar form { display: flex; flex-direction: column; gap: 8px; }
    .name-in {
      width: 100%; border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
      border-radius: 12px; padding: 13px 14px; font-size: 16px;
    }
    .name-in:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .add-row2 { display: flex; gap: 8px; align-items: stretch; }
    .qtybox { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); flex: 0 0 auto; }
    .qtybox button { border: none; background: none; color: var(--text); width: 40px; height: 46px; font-size: 20px; cursor: pointer; }
    .qtybox span { width: 24px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; }
    .addbar select {
      flex: 1 1 auto; min-width: 0; border: 1px solid var(--border); background: var(--surface-2);
      color: var(--text); border-radius: 12px; padding: 12px 10px; font-size: 15px;
    }
    .add-btn {
      flex: 0 0 auto; border: none; background: var(--accent); color: #fff; padding: 0 22px; height: 46px;
      border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .add-btn:disabled { opacity: .4; }

    .reset {
      display: block; margin: 22px auto 4px; border: 1px solid var(--border); background: var(--surface);
      color: var(--text-dim); padding: 10px 20px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .reset:active { background: var(--surface-2); }
    .reset[hidden] { display: none; }

    /* Toast */
    .toast {
      position: fixed; left: 50%; transform: translateX(-50%) translateY(20px);
      bottom: calc(150px + var(--safe-bottom)); z-index: 50; background: #14181d; color: #fff;
      padding: 12px 14px 12px 18px; border-radius: 12px; display: flex; align-items: center; gap: 16px;
      box-shadow: 0 6px 24px rgba(0,0,0,.3); font-size: 14px; opacity: 0; pointer-events: none;
      transition: all .2s ease; max-width: 92vw;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .toast button { border: none; background: none; color: var(--accent); font-weight: 700; font-size: 14px; cursor: pointer; padding: 4px 6px; }
    :root[data-theme="dark"] .toast { background: #2a323c; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast { background: #2a323c; } }

    /* Edit-in-place */
    .item.editing { padding: 8px 10px; }
    .edit-name {
      flex: 1 1 auto; min-width: 0; border: 1px solid var(--accent); background: var(--surface-2);
      color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 16px;
    }
    .edit-name:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .edit-save, .edit-cancel {
      flex: 0 0 auto; border: none; width: 40px; height: 42px; border-radius: 10px; cursor: pointer;
      display: grid; place-items: center; font-size: 18px;
    }
    .edit-save { background: var(--accent); color: #fff; }
    .edit-cancel { background: var(--surface-2); color: var(--text-dim); }
    .edit-btn {
      flex: 0 0 auto; border: none; background: none; color: var(--text-dim); padding: 6px;
      cursor: pointer; border-radius: 8px; display: grid; place-items: center;
    }
    .edit-btn:active { background: var(--surface-2); color: var(--accent); }
    .edit-btn svg { width: 19px; height: 19px; stroke: currentColor; stroke-width: 2; fill: none; }

    /* Autocomplete suggestions (above the name input) */
    .suggests { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 2px; scrollbar-width: none; }
    .suggests:empty { display: none; }
    .suggests::-webkit-scrollbar { display: none; }
    .sugg {
      flex: 0 0 auto; border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
      padding: 8px 13px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap;
    }
    .sugg:active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .sugg .s-emoji { margin-right: 5px; }

    /* Category-order list in settings */
    .cat-order { display: flex; flex-direction: column; gap: 6px; }
    .cat-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .cat-row .c-label { flex: 1 1 auto; font-size: 15px; }
    .cat-row .c-move { border: none; background: var(--surface-2); color: var(--text); width: 34px; height: 34px; border-radius: 8px; font-size: 15px; cursor: pointer; }
    .cat-row .c-move:disabled { opacity: .3; cursor: default; }

    /* Settings sheet */
    .overlay {
      position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.4);
      display: flex; align-items: flex-end; justify-content: center;
    }
    .overlay[hidden] { display: none; }
    .sheet {
      width: 100%; max-width: 640px; background: var(--bg); border-radius: 20px 20px 0 0;
      padding: 8px 20px calc(24px + var(--safe-bottom)); max-height: 88vh; overflow-y: auto;
      animation: slideUp .22s ease;
    }
    @keyframes slideUp { from { transform: translateY(30px); opacity: .6 } to { transform: none; opacity: 1 } }
    .sheet-grip { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 8px auto 4px; }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 0 12px; }
    .sheet-head h2 { margin: 0; font-size: 20px; }
    .sheet-head button { border: none; background: var(--surface-2); color: var(--text); width: 34px; height: 34px; border-radius: 999px; font-size: 16px; cursor: pointer; }
    .set-section { padding: 14px 0; border-top: 1px solid var(--border); }
    .set-section > label { display: block; font-size: 13px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 10px; }
    .segment { display: flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
    .segment button { flex: 1; border: none; background: none; color: var(--text-dim); padding: 10px; border-radius: 9px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .segment button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
    .swatches { display: flex; flex-wrap: wrap; gap: 14px; }
    .swatch { width: 44px; height: 44px; border-radius: 999px; border: 3px solid transparent; cursor: pointer; position: relative; }
    .swatch.on { border-color: var(--text); }
    .swatch.on::after { content: '✓'; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px; }
    .danger-btn { width: 100%; border: 1px solid var(--danger); background: transparent; color: var(--danger); padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .danger-btn:active { background: var(--danger); color: #fff; }
    .set-hint { font-size: 12.5px; color: var(--text-dim); margin: 8px 2px 0; line-height: 1.35; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-row">
        <h1>Groceries</h1>
        <div class="head-right">
          <span class="count" id="count"></span>
          <button class="icon-btn" id="settingsBtn" aria-label="settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </div>
      <div class="chips" id="chips"></div>
    </header>

    <main id="list"></main>

    <button class="reset" id="reset" hidden>Uncheck all</button>
  </div>

  <div class="addbar">
    <form id="addform" autocomplete="off">
      <div class="suggests" id="suggests"></div>
      <input class="name-in" id="nameIn" placeholder="Add an item…" enterkeyhint="done" />
      <div class="add-row2">
        <div class="qtybox" aria-label="quantity">
          <button type="button" id="qMinus" aria-label="decrease">−</button>
          <span id="qVal">1</span>
          <button type="button" id="qPlus" aria-label="increase">+</button>
        </div>
        <select id="catIn" aria-label="category"></select>
        <button class="add-btn" id="addBtn" type="submit">Add</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast">
    <span id="toastMsg"></span>
    <button id="toastUndo" type="button">Undo</button>
  </div>

  <!-- Settings sheet -->
  <div class="overlay" id="settings" hidden>
    <div class="sheet" role="dialog" aria-label="Settings">
      <div class="sheet-grip"></div>
      <div class="sheet-head"><h2>Settings</h2><button id="closeSettings" aria-label="close">✕</button></div>

      <div class="set-section">
        <label>Appearance</label>
        <div class="segment" id="appearance">
          <button data-v="system">System</button>
          <button data-v="light">Light</button>
          <button data-v="dark">Dark</button>
        </div>
      </div>

      <div class="set-section">
        <label>Theme color</label>
        <div class="swatches" id="swatches"></div>
      </div>

      <div class="set-section">
        <label>Category order</label>
        <div class="cat-order" id="catOrder"></div>
        <p class="set-hint">Reorder to match your store's aisles — the list follows this order.</p>
      </div>

      <div class="set-section">
        <label>Danger zone</label>
        <button class="danger-btn" id="clearAll">Clear entire list</button>
        <p class="set-hint">Removes every item. You'll get an Undo for a few seconds.</p>
      </div>
    </div>
  </div>

  <script src="model.js"></script>
  <script>
  /* View layer. Core data model lives in model.js (shared with tests). */
  const { CATEGORIES, catById, createStore, sortForDisplay, createHistory } = GroceryModel;
  const store = createStore(localStorage);
  const history = createHistory(localStorage);

  /* Categories in the user's chosen order (settings.catOrder); unknown/new
     categories append at the end. Used for the list, chips, and the picker. */
  function orderedCategories() {
    const order = (settings.catOrder && settings.catOrder.length) ? settings.catOrder : CATEGORIES.map(c => c.id);
    const byId = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));
    const seen = new Set(); const out = [];
    order.forEach(id => { if (byId[id] && !seen.has(id)) { out.push(byId[id]); seen.add(id); } });
    CATEGORIES.forEach(c => { if (!seen.has(c.id)) out.push(c); });
    return out;
  }

  /* ---------- Settings: theme color + light/dark, persisted separately ---------- */
  const PALETTE = {
    green:  { light: ['#16a34a', '#dcfce7'], dark: ['#22c55e', '#14311f'] },
    blue:   { light: ['#2563eb', '#dbeafe'], dark: ['#3b82f6', '#17233f'] },
    teal:   { light: ['#0d9488', '#ccfbf1'], dark: ['#14b8a6', '#0f302c'] },
    purple: { light: ['#7c3aed', '#ede9fe'], dark: ['#8b5cf6', '#241a3d'] },
    pink:   { light: ['#db2777', '#fce7f3'], dark: ['#ec4899', '#3b1d2c'] },
    orange: { light: ['#ea580c', '#ffedd5'], dark: ['#f97316', '#3a2213'] },
  };
  const SKEY = 'grocery-settings-v1';
  let settings = { accent: 'green', appearance: 'system' };
  try { Object.assign(settings, JSON.parse(localStorage.getItem(SKEY) || '{}')); } catch {}
  if (!PALETTE[settings.accent]) settings.accent = 'green';
  const darkMq = matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => settings.appearance === 'dark' || (settings.appearance === 'system' && darkMq.matches);

  function applySettings() {
    const root = document.documentElement;
    if (settings.appearance === 'system') root.removeAttribute('data-theme');
    else root.setAttribute('data-theme', settings.appearance);
    const [accent, dim] = PALETTE[settings.accent][isDark() ? 'dark' : 'light'];
    root.style.setProperty('--accent', accent);
    root.style.setProperty('--accent-dim', dim);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', isDark() ? '#0f1216' : accent);
  }
  function saveSettings() { localStorage.setItem(SKEY, JSON.stringify(settings)); }
  darkMq.addEventListener('change', () => { if (settings.appearance === 'system') applySettings(); });
  applySettings();   // apply before first paint of the list

  /* ---------- Undo: snapshot-based, one level, 5s window ---------- */
  const undo = {
    snap: null, timer: null,
    offer(message, prevSnapshot) {
      this.snap = prevSnapshot; clearTimeout(this.timer);
      toastMsg.textContent = message; toast.classList.add('show');
      this.timer = setTimeout(() => this.dismiss(), 5000);
    },
    apply() {
      if (this.snap == null) return;
      store.restore(this.snap); this.snap = null; clearTimeout(this.timer);
      toast.classList.remove('show'); render();
    },
    dismiss() { this.snap = null; toast.classList.remove('show'); },
  };

  let activeFilter = 'all';
  let editingId = null;

  const listEl = document.getElementById('list');
  const chipsEl = document.getElementById('chips');
  const countEl = document.getElementById('count');
  const resetBtn = document.getElementById('reset');
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  const nameIn = document.getElementById('nameIn');
  const catIn = document.getElementById('catIn');
  const qVal = document.getElementById('qVal');
  const addBtn = document.getElementById('addBtn');

  const CHECK_SVG = '<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>';
  const TRASH_SVG = '<svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
  const EDIT_SVG = '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>';

  function render() {
    // chips
    chipsEl.innerHTML = '';
    const usedCats = new Set(store.items.map(i => i.category));
    const mkChip = (id, label) => {
      const b = document.createElement('button');
      b.className = 'chip' + (activeFilter === id ? ' active' : '');
      b.textContent = label;
      b.onclick = () => { activeFilter = id; render(); };
      return b;
    };
    chipsEl.appendChild(mkChip('all', 'All'));
    orderedCategories().filter(c => usedCats.has(c.id)).forEach(c => chipsEl.appendChild(mkChip(c.id, c.emoji + ' ' + c.label)));

    // count
    const total = store.items.length;
    countEl.textContent = total ? `${store.countLeft()} left · ${total}` : '';
    resetBtn.hidden = !store.hasChecked();

    // list
    listEl.innerHTML = '';
    let visible = store.items;
    if (activeFilter !== 'all') visible = visible.filter(i => i.category === activeFilter);

    if (!visible.length) {
      listEl.innerHTML = `<div class="empty"><div class="big">🛒</div>${
        total ? 'Nothing in this category.' : 'Your list is empty.<br>Add something below.'}</div>`;
      if (!total) return;   // no end-of-list add row when totally empty (add bar is right there)
    }

    const cats = activeFilter === 'all'
      ? orderedCategories().filter(c => visible.some(i => i.category === c.id))
      : [catById(activeFilter)];

    cats.forEach(cat => {
      const inCat = sortForDisplay(visible.filter(i => i.category === cat.id));
      if (!inCat.length) return;
      const group = document.createElement('div');
      group.className = 'group';
      const head = document.createElement('div');
      head.className = 'group-head';
      const leftInCat = inCat.filter(i => !i.checked).length;
      head.innerHTML = `<span>${cat.emoji}</span><span>${cat.label}</span><span class="g-count">${leftInCat}/${inCat.length}</span>`;
      group.appendChild(head);
      const ul = document.createElement('ul');
      inCat.forEach(it => ul.appendChild(renderItem(it)));
      group.appendChild(ul);
      listEl.appendChild(group);
    });

    // "+ Add item" affordance at the end of the list -> jumps to the input
    if (total) {
      const addRow = document.createElement('button');
      addRow.className = 'list-add';
      addRow.id = 'listAdd';
      addRow.innerHTML = '<span class="plus">+</span><span>Add item</span>';
      addRow.onclick = () => { nameIn.focus(); nameIn.scrollIntoView({ block: 'center' }); };
      listEl.appendChild(addRow);
    }
  }

  function renderItem(it) {
    // --- inline editor (tap the pencil) ---
    if (editingId === it.id) {
      const li = document.createElement('li');
      li.className = 'item editing';
      const input = document.createElement('input');
      input.className = 'edit-name'; input.value = it.name; input.setAttribute('aria-label', 'edit name');
      let eq = it.qty || 1;
      const qbox = document.createElement('div'); qbox.className = 'qtybox';
      const minus = document.createElement('button'); minus.type = 'button'; minus.textContent = '−';
      const val = document.createElement('span'); val.textContent = eq;
      const plus = document.createElement('button'); plus.type = 'button'; plus.textContent = '+';
      minus.onclick = () => { eq = Math.max(1, eq - 1); val.textContent = eq; };
      plus.onclick = () => { eq = Math.min(99, eq + 1); val.textContent = eq; };
      qbox.append(minus, val, plus);
      const commit = () => {
        store.update(it.id, { name: input.value, qty: eq });
        if (input.value.trim()) history.record(input.value, it.category);  // remember corrected names too
        editingId = null; render();
      };
      const cancel = () => { editingId = null; render(); };
      const save = document.createElement('button'); save.className = 'edit-save'; save.innerHTML = '✓'; save.setAttribute('aria-label', 'save'); save.onclick = commit;
      const cancelBtn = document.createElement('button'); cancelBtn.className = 'edit-cancel'; cancelBtn.innerHTML = '✕'; cancelBtn.setAttribute('aria-label', 'cancel'); cancelBtn.onclick = cancel;
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') commit(); else if (e.key === 'Escape') cancel(); });
      li.append(input, qbox, save, cancelBtn);
      setTimeout(() => input.focus(), 0);
      return li;
    }

    const li = document.createElement('li');
    li.className = 'item' + (it.checked ? ' checked' : '');
    const box = document.createElement('div');
    box.className = 'box' + (it.checked ? ' on' : '');
    box.innerHTML = CHECK_SVG;
    box.setAttribute('role', 'checkbox');
    box.setAttribute('aria-checked', it.checked);
    box.onclick = () => toggle(it.id);
    const body = document.createElement('div');
    body.className = 'body';
    body.innerHTML = `<span class="name">${escapeHtml(it.name)}</span>${
      it.qty && it.qty > 1 ? `<span class="qty">×${it.qty}</span>` : ''}`;
    body.onclick = () => toggle(it.id);
    const edit = document.createElement('button');
    edit.className = 'edit-btn';
    edit.setAttribute('aria-label', 'edit ' + it.name);
    edit.innerHTML = EDIT_SVG;
    edit.onclick = (e) => { e.stopPropagation(); editingId = it.id; render(); };
    const del = document.createElement('button');
    del.className = 'del';
    del.setAttribute('aria-label', 'delete ' + it.name);
    del.innerHTML = TRASH_SVG;
    del.onclick = (e) => {
      e.stopPropagation();
      const prev = store.snapshot();
      store.remove(it.id); render();
      undo.offer(`Deleted "${it.name}"`, prev);
    };
    li.append(box, body, edit, del);
    return li;
  }

  function toggle(id) {
    store.toggle(id);
    if (navigator.vibrate) navigator.vibrate(8);   // subtle haptic on phones that support it
    render();
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  /* ---------- Add form ---------- */
  let qty = 1;
  function setQty(n) { qty = Math.max(1, Math.min(99, n)); qVal.textContent = qty; }
  document.getElementById('qPlus').onclick = () => setQty(qty + 1);
  document.getElementById('qMinus').onclick = () => setQty(qty - 1);

  function populateCatSelect() {
    const cur = catIn.value;
    const ord = orderedCategories();
    catIn.innerHTML = '';
    ord.forEach(c => {
      const o = document.createElement('option');
      o.value = c.id; o.textContent = c.emoji + ' ' + c.label;
      catIn.appendChild(o);
    });
    catIn.value = (cur && ord.some(c => c.id === cur)) ? cur : 'other';
  }
  populateCatSelect();

  nameIn.addEventListener('input', () => { addBtn.disabled = !nameIn.value.trim(); renderSuggests(); });
  addBtn.disabled = true;

  document.getElementById('addform').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = nameIn.value.trim();
    if (!name) return;
    const cat = activeFilter !== 'all' ? activeFilter : catIn.value;
    store.add(name, qty, cat);
    history.record(name, cat);
    nameIn.value = ''; setQty(1); addBtn.disabled = true;
    render(); renderSuggests(); nameIn.focus();
  });

  /* ---------- Autocomplete from history ---------- */
  const suggestsEl = document.getElementById('suggests');
  let suggestOpen = false;
  function renderSuggests() {
    suggestsEl.innerHTML = '';
    if (!suggestOpen) return;
    history.suggest(nameIn.value, 8).forEach(e => {
      const c = catById(e.category);
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'sugg';
      b.innerHTML = `<span class="s-emoji">${c.emoji}</span>${escapeHtml(e.name)}`;
      b.addEventListener('mousedown', ev => ev.preventDefault());  // keep input focused
      b.onclick = () => {
        store.add(e.name, 1, e.category);
        history.record(e.name, e.category);
        nameIn.value = ''; setQty(1); addBtn.disabled = true;
        render(); renderSuggests(); nameIn.focus();
      };
      suggestsEl.appendChild(b);
    });
  }
  nameIn.addEventListener('focus', () => { suggestOpen = true; renderSuggests(); });
  nameIn.addEventListener('blur', () => { setTimeout(() => { suggestOpen = false; renderSuggests(); }, 150); });

  /* ---------- Reset (uncheck all) with undo ---------- */
  resetBtn.onclick = () => {
    if (!store.hasChecked()) return;
    const prev = store.snapshot();
    store.uncheckAll(); render();
    undo.offer('Unchecked all items', prev);
  };
  document.getElementById('toastUndo').onclick = () => undo.apply();

  /* ---------- Settings sheet wiring ---------- */
  const settingsEl = document.getElementById('settings');
  const appearanceEl = document.getElementById('appearance');
  const swatchesEl = document.getElementById('swatches');
  const catOrderEl = document.getElementById('catOrder');

  function paintSettings() {
    [...appearanceEl.children].forEach(b => b.classList.toggle('on', b.dataset.v === settings.appearance));
    swatchesEl.innerHTML = '';
    Object.keys(PALETTE).forEach(name => {
      const sw = document.createElement('button');
      sw.className = 'swatch' + (settings.accent === name ? ' on' : '');
      sw.style.background = PALETTE[name][isDark() ? 'dark' : 'light'][0];
      sw.setAttribute('aria-label', name);
      sw.onclick = () => { settings.accent = name; saveSettings(); applySettings(); paintSettings(); render(); };
      swatchesEl.appendChild(sw);
    });
    paintCatOrder();
  }

  function paintCatOrder() {
    catOrderEl.innerHTML = '';
    const ord = orderedCategories();
    ord.forEach((c, idx) => {
      const row = document.createElement('div'); row.className = 'cat-row';
      const lbl = document.createElement('span'); lbl.className = 'c-label';
      lbl.textContent = c.emoji + '  ' + c.label;
      const up = document.createElement('button'); up.className = 'c-move'; up.textContent = '↑'; up.disabled = idx === 0; up.setAttribute('aria-label', 'move ' + c.label + ' up');
      const down = document.createElement('button'); down.className = 'c-move'; down.textContent = '↓'; down.disabled = idx === ord.length - 1; down.setAttribute('aria-label', 'move ' + c.label + ' down');
      up.onclick = () => moveCat(idx, -1);
      down.onclick = () => moveCat(idx, +1);
      row.append(lbl, up, down);
      catOrderEl.appendChild(row);
    });
  }
  function moveCat(idx, dir) {
    const ids = orderedCategories().map(c => c.id);
    const j = idx + dir;
    if (j < 0 || j >= ids.length) return;
    [ids[idx], ids[j]] = [ids[j], ids[idx]];
    settings.catOrder = ids; saveSettings();
    populateCatSelect(); paintCatOrder(); render();
  }
  appearanceEl.querySelectorAll('button').forEach(b => {
    b.onclick = () => { settings.appearance = b.dataset.v; saveSettings(); applySettings(); paintSettings(); render(); };
  });
  document.getElementById('settingsBtn').onclick = () => { paintSettings(); settingsEl.hidden = false; };
  document.getElementById('closeSettings').onclick = () => { settingsEl.hidden = true; };
  settingsEl.onclick = (e) => { if (e.target === settingsEl) settingsEl.hidden = true; };
  document.getElementById('clearAll').onclick = () => {
    if (!store.items.length) { settingsEl.hidden = true; return; }
    const prev = store.snapshot();
    store.items = []; store.save();
    settingsEl.hidden = true; render();
    undo.offer('Cleared the whole list', prev);
  };

  /* ---------- Boot ---------- */
  store.load();
  render();

  /* ---------- Service worker ---------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  </script>
</body>
</html>
